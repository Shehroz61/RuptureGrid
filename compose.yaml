# =====================================================================
# RuptureGrid v1.0 — local development infrastructure
# =====================================================================
# Three PHYSICALLY SEPARATE PostgreSQL services (RuptureGrid Control,
# Demo Fintech target, Demo Commerce target) plus Redis
# (coordination-only) — per ADR-0002 (Phase 16 adds the second target
# database, ADR-0020). Named volumes, no host-path mounts, healthchecks
# on every service. Ports are environment-configurable (see
# .env.example).
#
# NOTE (documented local default deviation): this machine already has
# unrelated containers bound to 5433/5434, so the documented defaults
# here are 5443/5444 (+5445 for the Phase 16 Commerce target). Override
# via CONTROL_POSTGRES_PORT / DEMO_POSTGRES_PORT / COMMERCE_POSTGRES_PORT.
#
# The Demo Fintech and Demo Commerce instances each need an extra shadow
# database for Prisma `migrate dev` / `migrate diff` verification (R-12).
# compose does NOT auto-create them: `pnpm db:migrate` (migrate deploy)
# needs no shadow, and CI creates both with explicit `CREATE DATABASE`
# steps; a local developer verifies migrations by creating them once
# (see .env.example *_SHADOW_DATABASE_URL comments).

name: rupturegrid

services:
  control-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${CONTROL_POSTGRES_USER:-rupturegrid}
      POSTGRES_PASSWORD: ${CONTROL_POSTGRES_PASSWORD:-rupturegrid_dev_password}
      POSTGRES_DB: ${CONTROL_POSTGRES_DB:-rupturegrid}
    ports:
      - '${CONTROL_POSTGRES_PORT:-5443}:5432'
    volumes:
      # PostgreSQL 18+ images use a version-specific PGDATA directory.
      - control-pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${CONTROL_POSTGRES_USER:-rupturegrid} -d ${CONTROL_POSTGRES_DB:-rupturegrid}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  demo-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DEMO_POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-demo_dev_password}
      POSTGRES_DB: ${DEMO_POSTGRES_DB:-demo_fintech}
    ports:
      - '${DEMO_POSTGRES_PORT:-5444}:5432'
    volumes:
      - demo-pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DEMO_POSTGRES_USER:-demo} -d ${DEMO_POSTGRES_DB:-demo_fintech}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  commerce-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${COMMERCE_POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:-commerce_dev_password}
      POSTGRES_DB: ${COMMERCE_POSTGRES_DB:-demo_commerce}
    ports:
      - '${COMMERCE_POSTGRES_PORT:-5445}:5432'
    volumes:
      - commerce-pgdata:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${COMMERCE_POSTGRES_USER:-commerce} -d ${COMMERCE_POSTGRES_DB:-demo_commerce}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.4
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  control-pgdata:
  demo-pgdata:
  commerce-pgdata:
  redis-data:
