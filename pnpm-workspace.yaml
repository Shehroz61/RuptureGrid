packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies whose postinstall build scripts are required:
# prisma + @prisma/engines (schema engine binaries), esbuild (native
# binary), msgpackr-extract (native optimization used by pino),
# ffmpeg-static (Phase 8 showcase video encoder binary download).
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  ffmpeg-static: true
  msgpackr-extract: true
  prisma: true
