name: Bug report
description: Report a reproducible correctness, execution, UI or documentation problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use [private vulnerability reporting](https://github.com/Shehroz61/RuptureGrid/security/policy).
        Do not include credentials, private target URLs, unredacted evidence or exploit details here.
  - type: input
    id: revision
    attributes:
      label: Version or full commit SHA
      description: Identify the checkout that exhibited the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, pnpm, Docker/Compose, browser if relevant, and local target type. Omit secrets and private addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, setup and a minimal redacted scenario when relevant. Distinguish repeats from retries.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include observed exit codes, verdicts or errors. Do not guess missing outcomes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs and verification
      description: Share only reviewed, redacted output. List checks run and any failures or skips.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed secrets and private target information.
          required: true
